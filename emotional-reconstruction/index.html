reason:j("Puede que el trabajo o los estudios te estén pidiendo mucho.","Work or school might be asking a lot of you.","Pode ser que o trabalho ou os estudos estejam exigindo muito de você."),tip:j("Elige una sola tarea para hoy. Una. Las demás pueden esperar.","Pick just one task for today. One. The rest can wait.","Escolha uma única tarefa para hoje. Uma. As outras podem esperar.")},personas:{reason:j("Lo que pasa con las personas que quieres te importa mucho, y eso se siente.","What happens with the people you love matters a lot to you, and you feel it.","O que acontece com as pessoas que você ama importa muito, e isso se sente."),tip:j("Si puedes, habla con alguien de confianza sobre esto.","If you can, talk about it with someone you trust.","Se puder, converse com alguém de confiança sobre isso.")},futuro:{reason:j("Pensar en lo que no sabemos del futuro puede llenar la mente de preguntas.","Thinking about what we don't know about the future can fill the mind with questions.","Pensar no que não sabemos do futuro pode encher a mente de perguntas."),tip:j("Por ahora, piensa solo en hoy. Hoy sí lo puedes vivir.","For now, think only about today. Today you can live.","Por agora, pense só no hoje. O hoje você consegue viver.")},noticias:{reason:j("Lo que ves en noticias y redes puede cargar el corazón sin que lo notes.","What you see in the news and online can weigh on your heart without you noticing.","O que você vê em notícias e redes pode pesar no coração sem você perceber."),tip:j("Prueba una hora sin redes hoy.","Try one hour without social media today.","Experimente uma hora sem redes hoje.")},soledad:{reason:j("Sentir soledad es muy difícil. Tiene sentido que te afecte.","Feeling lonely is really hard. It makes sense that it affects you.","Sentir solidão é muito difícil. Faz sentido que isso te afete."),tip:j("Manda un mensaje corto a alguien que te quiere.","Send a short message to someone who cares about you.","Mande uma mensagem curta para alguém que gosta de você.")},ninguno:{reason:j("A veces no hay una sola razón, y está bien no saberlo todo hoy.","Sometimes there isn't just one reason, and it's okay not to know everything today.","Às vezes não existe um único motivo, e tudo bem não saber tudo hoje."),tip:j("Escucha a tu cuerpo: agua, aire y un descanso cortito.","Listen to your body: water, fresh air and a short break.","Escute seu corpo: água, ar e uma pausa curtinha.")},positivo:{reason:j("¡Qué bueno sentirte así! Fíjate en qué te ayudó, para repetirlo.","So good to feel this way! Notice what helped, so you can do it again.","Que bom se sentir assim! Repare no que ajudou, para repetir."),tip:j("Comparte algo bueno con alguien hoy.","Share something good with someone today.","Compartilhe algo bom com alguém hoje.")}},Eg={default:j("Tiene sentido sentirse así.","It makes sense to feel this way.","Faz sentido se sentir assim."),positive:j("Guarda este momento en tu corazón.","Keep this moment in your heart.","Guarde este momento no coração.")},Ng={respirar:{emoji:"🦋",interactive:"breath",title:j("Respira con la mariposa","Breathe with the butterfly","Respire com a borboleta"),text:j("Cuando las alas se abren, toma aire. Cuando se cierran, suéltalo despacio.","When the wings open, breathe in. When they close, breathe out slowly.","Quando as asas abrirem, puxe o ar. Quando fecharem, solte devagar.")},ventana:{emoji:"🪟",title:j("Ve a la ventana","Go to a window","Vá até a janela"),text:j("Mira el cielo 30 segundos y respira hondo tres veces.","Look at the sky for 30 seconds and take three deep breaths.","Olhe o céu por 30 segundos e respire fundo três vezes.")},agua:{emoji:"💧",title:j("Toma agua","Drink water","Beba água"),text:j("Toma un vaso de agua despacio, sorbo a sorbo.","Drink a glass of water slowly, sip by sip.","Beba um copo de água devagar, gole a gole.")},llamar:{emoji:"📞",title:j("Escribe a alguien","Message someone","Escreva para alguém"),text:j('Manda esto a alguien que te quiere: "Hola, pensé en ti".','Send this to someone who cares: "Hi, I thought of you."','Mande isto para alguém que gosta de você: "Oi, pensei em você".')},voz_alta:{emoji:"🗣️",title:j("Dilo en voz alta","Say it out loud","Diga em voz alta"),text:j("Lee el versículo de abajo en voz alta tres veces.","Read the verse below out loud three times.","Leia o versículo abaixo em voz alta três vezes.")},escribir:{emoji:"✏️",title:j("Escribe una línea","Write one line","Escreva uma linha"),text:j("Escribe en un papel una cosa que te preocupa. Luego dóblalo.","Write one worry on a piece of paper. Then fold it.","Escreva num papel uma coisa que te preocupa. Depois dobre.")},moverse:{emoji:"🙆",title:j("Estírate","Stretch","Alongue-se"),text:j("Sube los brazos al cielo, cuenta hasta 10 y bájalos despacio.","Raise your arms to the sky, count to 10, and lower them slowly.","Levante os braços para o céu, conte até 10 e abaixe devagar.")},gracias:{emoji:"🌻",title:j("Tres gracias","Three thanks","Três obrigados"),text:j("Di tres cosas por las que hoy das gracias.","Say three things you are thankful for today.","Diga três coisas pelas quais você agradece hoje.")}},Cg={ansiedad:"respirar",miedo:"respirar",preocupacion:"escribir",confusion:"escribir",tristeza:"ventana",desanimo:"ventana",no_puedo:"respirar",rabia:"moverse",cansancio:"agua",agotamiento:"agua",aburrimiento:"moverse",soledad:"llamar",alegria:"gracias",paz:"voz_alta",gratitud:"gracias",energia:"llamar"},Pg={es:{active:"RV1909",target:"NVI",license:"Dominio público. NVI requiere permiso de Biblica."},en:{active:"KJV",target:"NIV",license:"Dominio público. NIV requiere permiso de Biblica."},pt:{active:"Almeida",target:"NVI",license:"Dominio público (verificar edición). NVI requiere permiso de Biblica."}},Tg=[{id:"rom12_2",ref:j("Romanos 12:2","Romans 12:2","Romanos 12:2"),emotions:["paz","energia","confusion"],text:j("No os conforméis a este siglo; mas reformaos por la renovación de vuestro entendimiento.","Be not conformed to this world: but be ye transformed by the renewing of your mind.","Não vos conformeis com este mundo, mas transformai-vos pela renovação do vosso entendimento."),reflection:j("Dios no quiere que solo repitas cosas. Quiere transformarte por dentro, como la larva que se vuelve mariposa.","God doesn't want you to just repeat things. He wants to change you from the inside, like a caterpillar becoming a butterfly.","Deus não quer que você só repita coisas. Ele quer te transformar por dentro, como a lagarta que vira borboleta.")},{id:"1pe5_7",ref:j("1 Pedro 5:7","1 Peter 5:7","1 Pedro 5:7"),emotions:["preocupacion","ansiedad"],text:j("Echando toda vuestra solicitud en él, porque él tiene cuidado de vosotros.","Casting all your care upon him; for he careth for you.","Lançando sobre ele toda a vossa ansiedade, porque ele tem cuidado de vós."),reflection:j("Jesús no se cansa de tus preocupaciones. Puedes dárselas una por una.","Jesus never gets tired of your worries. You can hand them to him one by one.","Jesus não se cansa das suas preocupações. Você pode entregá-las uma por uma.")},{id:"sal34_18",ref:j("Salmos 34:18","Psalm 34:18","Salmos 34:18"),emotions:["tristeza","no_puedo","soledad"],text:j("Cercano está el Señor a los quebrantados de corazón; y guardará a los contritos de espíritu.","The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","Perto está o Senhor dos que têm o coração quebrantado, e salva os contritos de espírito."),reflection:j("Cuando el corazón duele, Dios no se aleja. Se acerca.","When your heart hurts, God doesn't move away. He comes closer.","Quando o coração dói, Deus não se afasta. Ele se aproxima.")},{id:"mt11_28",ref:j("Mateo 11:28","Matthew 11:28","Mateus 11:28"),emotions:["cansancio","agotamiento","desanimo"],text:j("Venid a mí todos los que estáis trabajados y cargados, que yo os haré descansar.","Come unto me, all ye that labour and are heavy laden, and I will give you rest.","Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei."),reflection:j("Jesús no te pide que llegues fuerte. Te invita a llegar con tu cansancio, tal como estás.","Jesus doesn't ask you to come strong. He invites you to come tired, just as you are.","Jesus não pede que você chegue forte. Ele te convida a chegar com seu cansaço, do jeito que está.")},{id:"jn14_27",ref:j("Juan 14:27","John 14:27","João 14:27"),emotions:["ansiedad","miedo","paz"],text:j("La paz os dejo, mi paz os doy: no como el mundo la da, yo os la doy. No se turbe vuestro corazón, ni tenga miedo.","Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá. Não se turbe o vosso coração, nem se atemorize."),reflection:j("La paz de Jesús no depende de que todo salga bien. Es un regalo que te da hoy.","Jesus' peace doesn't depend on everything going right. It's a gift he gives you today.","A paz de Jesus não depende de tudo dar certo. É um presente que ele te dá hoje.")},{id:"is41_10",ref:j("Isaías 41:10","Isaiah 41:10","Isaías 41:10"),emotions:["miedo","ansiedad","desanimo"],text:j("No temas, que yo soy contigo; no desmayes, que yo soy tu Dios que te esfuerzo: siempre te ayudaré.","Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee.","Não temas, porque eu sou contigo; não te assombres, porque eu sou teu Deus; eu te fortaleço, e te ajudo."),reflection:j("Dios está contigo en esto. Promete ayudarte, no que nunca tendrás miedo.","You are not alone in this. God promises to help you, not that you'll never be afraid.","Deus está com você nisso. Ele promete te ajudar, não que você nunca terá medo.")},{id:"heb13_5",ref:j("Hebreos 13:5","Hebrews 13:5","Hebreus 13:5"),emotions:["soledad"],text:j("No te desampararé, ni te dejaré.","I will never leave thee, nor forsake thee.","Não te deixarei, nem te desampararei."),reflection:j("Aunque te sientas sin compañía, Jesús se quedó contigo. No se va.","Even when you feel alone, Jesus stays with you. He does not leave.","Mesmo quando a solidão aperta, Jesus fica com você. Ele não vai embora.")},{id:"ef4_26",ref:j("Efesios 4:26","Ephesians 4:26","Efésios 4:26"),emotions:["rabia"],text:j("Airaos, y no pequéis; no se ponga el sol sobre vuestro enojo.","Be ye angry, and sin not: let not the sun go down upon your wrath.","Irai-vos e não pequeis; não se ponha o sol sobre a vossa ira."),reflection:j("Sentir rabia no está mal. Lo importante es qué haces con ella antes de dormir.","Feeling angry isn't wrong. What matters is what you do with it before you sleep.","Sentir raiva não é errado. O importante é o que você faz com ela antes de dormir.")},{id:"sal118_24",ref:j("Salmos 118:24","Psalm 118:24","Salmos 118:24"),emotions:["alegria","energia"],text:j("Este es el día que hizo el Señor: nos gozaremos y alegraremos en él.","This is the day which the LORD hath made; we will rejoice and be glad in it.","Este é o dia que fez o Senhor; regozijemo-nos e alegremo-nos nele."),reflection:j("Hoy también es un regalo. Disfrútalo con Dios.","Today is a gift too. Enjoy it with God.","Hoje também é um presente. Aproveite com Deus.")},{id:"sal4_8",ref:j("Salmos 4:8","Psalm 4:8","Salmos 4:8"),emotions:["cansancio","paz"],text:j("En paz me acostaré, y asimismo dormiré; porque solo tú, Señor, me harás estar confiado.","I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.","Em paz também me deitarei e dormirei, porque só tu, Senhor, me fazes habitar em segurança."),reflection:j("Puedes descansar. Dios sigue cuidando mientras duermes.","You can rest. God keeps watching over you while you sleep.","Você pode descansar. Deus continua cuidando enquanto você dorme.")},{id:"mt6_34",ref:j("Mateo 6:34","Matthew 6:34","Mateus 6:34"),emotions:["preocupacion","confusion"],text:j("No os congojéis por el día de mañana; que el día de mañana traerá su fatiga: basta al día su afán.","Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself.","Não vos inquieteis, pois, pelo dia de amanhã, porque o dia de amanhã cuidará de si mesmo."),reflection:j("Jesús te invita a vivir un día a la vez. Mañana tendrá su propia ayuda.","Jesus invites you to live one day at a time. Tomorrow will have its own help.","Jesus te convida a viver um dia de cada vez. O amanhã terá sua própria ajuda.")},{id:"lam3_22",ref:j("Lamentaciones 3:22-23","Lamentations 3:22-23","Lamentações 3:22-23"),emotions:["desanimo","tristeza","aburrimiento"],text:j("Nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad.","His compassions fail not. They are new every morning: great is thy faithfulness.","As suas misericórdias não têm fim; novas são cada manhã; grande é a tua fidelidade."),reflection:j("Cada mañana Dios empieza de nuevo contigo. Mañana también.","Every morning God starts fresh with you. Tomorrow too.","Cada manhã Deus recomeça com você. Amanhã também.")},{id:"jn11_35",ref:j("Juan 11:35","John 11:35","João 11:35"),emotions:["tristeza","soledad"],text:j("Y lloró Jesús.","Jesus wept.","Jesus chorou."),reflection:j("Jesús también lloró. Tu tristeza no lo asusta; él la entiende.","Jesus cried too. Your sadness doesn't scare him; he understands it.","Jesus também chorou. Sua tristeza não o assusta; ele a entende.")},{id:"sal56_3",ref:j("Salmos 56:3","Psalm 56:3","Salmos 56:3"),emotions:["miedo","ansiedad"],text:j("En el día que temo, yo en ti confío.","What time I am afraid, I will trust in thee.","Em qualquer tempo em que eu temer, confiarei em ti."),reflection:j("Tener miedo y confiar pueden pasar al mismo tiempo. Eso también es fe.","Being afraid and trusting can happen at the same time. That is faith too.","Ter medo e confiar podem acontecer ao mesmo tempo. Isso também é fé.")},{id:"is40_31",ref:j("Isaías 40:31","Isaiah 40:31","Isaías 40:31"),emotions:["agotamiento","cansancio","energia"],text:j("Los que esperan al Señor tendrán nuevas fuerzas; levantarán las alas como águilas.","They that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles.","Os que esperam no Senhor renovarão as forças, subirão com asas como águias."),reflection:j("Las fuerzas nuevas vienen de Dios, no de esforzarte más.","New strength comes from God, not from trying harder.","As forças novas vêm de Deus, não de se esforçar mais.")},{id:"jn10_11",ref:j("Juan 10:11","John 10:11","João 10:11"),emotions:["soledad","miedo","paz","no_puedo"],text:j("Yo soy el buen pastor: el buen pastor su vida da por las ovejas.","I am the good shepherd: the good shepherd giveth his life for the sheep.","Eu sou o bom Pastor; o bom Pastor dá a sua vida pelas ovelhas."),reflection:j("Jesús es como un pastor que cuida a cada oveja por su nombre. También a ti.","Jesus is like a shepherd who knows each sheep by name. You too.","Jesus é como um pastor que cuida de cada ovelha pelo nome. De você também.")},{id:"1ts5_18",ref:j("1 Tesalonicenses 5:18","1 Thessalonians 5:18","1 Tessalonicenses 5:18"),emotions:["gratitud","alegria"],text:j("Dad gracias en todo; porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.","In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","Em tudo dai graças, porque esta é a vontade de Deus em Cristo Jesus para convosco."),reflection:j("Dar gracias abre los ojos a lo bueno que ya está aquí.","Giving thanks opens your eyes to the good that is already here.","Agradecer abre os olhos para o bem que já está aqui.")}],Og={US:{name:j("Línea 988 de Crisis y Suicidio","988 Suicide & Crisis Lifeline","Linha 988 de Crise e Suicídio"),number:"988",sms:"988",emergency:"911",verified:"2026-10-17"},MX:{name:j("Línea de la Vida","Línea de la Vida","Línea de la Vida"),number:"800 911 2000",emergency:"911",verified:"pendiente"},CO:{name:j("Línea 192, opción 4 (salud mental)","Line 192, option 4 (mental health)","Linha 192, opção 4 (saúde mental)"),number:"192",emergency:"123",verified:"2026-10-17"},BR:{name:j("CVV – Centro de Valorización de la Vida","CVV – Centro de Valorização da Vida","CVV – Centro de Valorização da Vida"),number:"188",emergency:"192",verified:"pendiente"},ES:{name:j("Línea 024 de atención a la conducta suicida","024 Suicide Prevention Line","Linha 024 de prevenção ao suicídio"),number:"024",emergency:"112",verified:"pendiente"},OTHER:{name:j("Número de emergencias de tu país","Your local emergency number","Número de emergência do seu país"),number:"",emergency:"",verified:"—"}},Ag={title:j("Gracias por decírmelo","Thank you for telling me","Obrigado por me contar"),body:j("Lo que sientes importa, y no tienes que pasarlo sin ayuda. Hablar con una persona ahora puede ayudar.","What you feel matters, and you don't have to go through it alone. Talking to a person right now can help.","O que você sente importa, e você não precisa passar por isso sem ajuda. Conversar com uma pessoa agora pode ajudar."),abuse:j("Si alguien te está haciendo daño, no es tu culpa. Busca a un adulto de confianza o llama a emergencias.","If someone is hurting you, it is not your fault. Find a trusted adult or call emergency services.","Se alguém está te machucando, a culpa não é sua. Procure um adulto de confiança ou ligue para a emergência."),danger:j("Si estás en peligro ahora mismo, llama al","If you are in danger right now, call","Se você está em perigo agora, ligue para"),trusted:j('Escribe ahora a alguien de confianza: "¿Puedes hablar conmigo? No estoy bien."',`Message someone you trust now: "Can you talk with me? I'm not okay."`,'Escreva agora para alguém de confiança: "Você pode falar comigo? Não estou bem."')},Dg=["suicid","matarme","quitarme la vida","no quiero vivir","quiero morir","hacerme daño","cortarme","me pega","me golpea","abusa","kill myself","end my life","want to die","hurt myself","cut myself","hits me","abuse","me matar","tirar minha vida","quero morrer","me machucar","me cortar","me bate","abusa de mim"],Lg=[{id:"larvita",min:0,name:j("Larvita","Little caterpillar","Lagartinha")},{id:"larva",min:4,name:j("Larva que crece","Growing caterpillar","Lagarta crescendo")},{id:"capullo",min:10,name:j("Capullo","Cocoon","Casulo")},{id:"capullo_luz",min:18,name:j("Capullo con luz","Glowing cocoon","Casulo com luz")},{id:"mariposa",min:28,name:j("Mariposa","Butterfly","Borboleta")}];function Wh(){return JSON.parse(JSON.stringify({version:1,publishedAt:"2026-10-17T14:00:00Z",note:"Borrador v1 del equipo de producto. Pendiente revisión clínica y teológica.",screens:_g,startScreen:jg,after:bg,rules:Sg,insights:kg,validations:Eg,actions:Ng,actionByEmotion:Cg,bibleVersions:Pg,verses:Tg,helplines:Og,crisisCopy:Ag,crisisKeywords:Dg,stages:Lg}))}function Fo(t){return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`}const Rg={"Contenido y flujos":["Content and flows","Conteúdo e fluxos"],"Producto y negocio":["Product and business","Produto e negócio"],Investigación:["Research","Pesquisa"],Piloto:["Pilot","Piloto"],"Demo fase 1":["Demo phase 1","Demo fase 1"],"Ver la app":["View the app","Ver o app"],Sesión:["Session","Sessão"],"Cerrar sesión":["Sign out","Sair"],"Flujo de preguntas":["Question flow","Fluxo de perguntas"],"Reglas y pareceres":["Rules and insights","Regras e pareceres"],"Acciones de 1 minuto":["1-minute actions","Ações de 1 minuto"],Versículos:["Verses","Versículos"],"Protocolo de crisis":["Crisis protocol","Protocolo de crise"],Versiones:["Versions","Versões"],"Admin de contenido":["Content admin","Admin de conteúdo"],"Cambia preguntas, opciones, textos y versículos sin programar. Los cambios quedan en borrador hasta que publiques.":["Change questions, options, texts and verses with no coding. Changes stay in draft until you publish.","Altere perguntas, opções, textos e versículos sem programar. As mudanças ficam em rascunho até você publicar."],"
