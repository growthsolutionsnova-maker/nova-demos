("¿Y tu cuerpo, cómo está?","And your body, how is it?","E o seu corpo, como está?"),options:[{code:"bien",emoji:"💪",label:y("Bien","Fine","Bem")},{code:"enfermo",emoji:"🤒",label:y("Gripa o malestar","Sick","Gripe ou mal-estar")},{code:"dolor",emoji:"🤕",label:y("Con dolor","In pain","Com dor")},{code:"ciclo",emoji:"🌙",label:y("En mis días","On my period","Naqueles dias")}],next:"mind"},mind:{type:"choice",key:"tema",title:"Tema en la mente",prompt:y("¿Qué ocupa tu mente hoy?","What's on your mind today?","O que ocupa sua mente hoje?"),options:[{code:"dinero",emoji:"💰",label:y("Dinero","Money","Dinheiro")},{code:"trabajo",emoji:"💼",label:y("Trabajo o estudio","Work or school","Trabalho ou estudo")},{code:"personas",emoji:"👨‍👩‍👧",label:y("Personas que quiero","People I love","Pessoas que amo")},{code:"otra",emoji:"➕",label:y("Otra cosa","Something else","Outra coisa"),next:"mind2"}],next:"reflect"},mind2:{type:"choice",key:"tema",title:"Tema en la mente (2)",prompt:y("¿Cuál de estas?","Which of these?","Qual destas?"),options:[{code:"futuro",emoji:"🔮",label:y("El futuro","The future","O futuro")},{code:"noticias",emoji:"📱",label:y("Noticias o redes","News or social media","Notícias ou redes")},{code:"soledad",emoji:"🏠",label:y("Estar sin compañía","Being alone","Estar sem companhia")},{code:"nada",emoji:"🤷",label:y("Nada en especial","Nothing special","Nada em especial")}],next:"reflect"},reflect:{type:"reflect",key:"necesidad",title:"Reflexión",prompt:y("Respira un momento. Si tu corazón pudiera hablar, ¿qué pediría?","Take a breath. If your heart could talk, what would it ask for?","Respire um pouco. Se seu coração pudesse falar, o que pediria?"),options:[{code:"descansar",emoji:"🛌",label:y("Descansar","Rest","Descansar")},{code:"escucha",emoji:"👂",label:y("Que alguien me escuche","Someone to listen","Alguém que me ouça")},{code:"esperanza",emoji:"🌅",label:y("Saber que todo estará bien","To know it will be okay","Saber que tudo vai ficar bem")},{code:"no_se",emoji:"💭",label:y("No sé todavía","I don't know yet","Ainda não sei")}],next:"@result"}},Yf="mood",Gf={helped:{key:"ayudo",prompt:y("¿Te ayudó este momento?","Did this moment help?","Esse momento ajudou?"),options:[{code:"si",emoji:"👍",label:y("Sí","Yes","Sim")},{code:"poco",emoji:"👌",label:y("Un poco","A little","Um pouco")},{code:"no",emoji:"👎",label:y("No","No","Não")}]},frequency:{key:"frecuencia",prompt:y("¿Te sientes así solo hoy o pasa seguido?","Do you feel like this only today, or often?","Você se sente assim só hoje ou com frequência?"),options:[{code:"hoy",emoji:"📍",label:y("Solo hoy","Only today","Só hoje")},{code:"dias",emoji:"📅",label:y("Hace unos días","For a few days","Há alguns dias")},{code:"siempre",emoji:"🔁",label:y("Casi siempre","Almost always","Quase sempre")}]}},Jf=[{id:"r_sueno_mal",when:{sueno:["mal"]},factor:"sueno",weight:5},{id:"r_sueno_poco",when:{sueno:["poco"]},factor:"sueno",weight:3},{id:"r_comida_no",when:{comida:["no"]},factor:"comida",weight:4},{id:"r_comida_poco",when:{comida:["poco"]},factor:"comida",weight:2},{id:"r_cuerpo",when:{cuerpo:["enfermo","dolor"]},factor:"cuerpo",weight:4},{id:"r_ciclo",when:{cuerpo:["ciclo"]},factor:"ciclo",weight:4},{id:"r_dinero",when:{tema:["dinero"]},factor:"dinero",weight:3.5},{id:"r_trabajo",when:{tema:["trabajo"]},factor:"trabajo",weight:3.5},{id:"r_personas",when:{tema:["personas"]},factor:"personas",weight:3.5},{id:"r_futuro",when:{tema:["futuro"]},factor:"futuro",weight:3},{id:"r_noticias",when:{tema:["noticias"]},factor:"noticias",weight:3},{id:"r_soledad_tema",when:{tema:["soledad"]},factor:"soledad",weight:3.5},{id:"r_soledad_emo",when:{emocion:["soledad"]},factor:"soledad",weight:4.5},{id:"r_bien",when:{animo:["bien"]},factor:"positivo",weight:10}],Kf={sueno:{reason:y("Puede que el cansancio esté influyendo en cómo te sientes. Cuando dormimos poco, todo pesa más.","Tiredness might be part of how you feel. When we sleep little, everything feels heavier.","Pode ser que o cansaço esteja influenciando como você se sente. Quando dormimos pouco, tudo pesa mais."),tip:y("Esta noche intenta acostarte un poquito más temprano.","Tonight, try going to bed a little earlier.","Hoje à noite, tente deitar um pouquinho mais cedo.")},comida:{reason:y("Puede que tu cuerpo necesite energía. Con hambre, las emociones se sienten más fuertes.","Your body might need energy. When we are hungry, feelings get stronger.","Pode ser que seu corpo precise de energia. Com fome, as emoções ficam mais fortes."),tip:y("Come algo sencillo y toma un vaso de agua.","Eat something simple and drink a glass of water.","Coma algo simples e beba um copo de água.")},cuerpo:{reason:y("Tu cuerpo no está al cien, y eso también cansa el corazón.","Your body isn't at its best, and that tires the heart too.","Seu corpo não está cem por cento, e isso também cansa o coração."),tip:y("Descansa hoy. Si el malestar sigue, habla con un médico.","Rest today. If you keep feeling unwell, talk to a doctor.","Descanse hoje. Se o mal-estar continuar, fale com um médico.")},ciclo:{reason:y("Los cambios del cuerpo durante el mes pueden mover las emociones. Es normal y pasa.","Body changes during the month can stir up feelings. It is normal and it passes.","As mudanças do corpo durante o mês podem mexer com as emoções. É normal e passa."),tip:y("Hoy sé amable contigo. Algo calientito y descanso ayudan.","Be kind to yourself today. Something warm and some rest help.","Hoje seja gentil com você. Algo quentinho e descanso ajudam.")},dinero:{reason:y("Puede que las preocupaciones de dinero estén ocupando mucho espacio en tu mente.","Money worries might be taking up a lot of space in your mind.","Pode ser que as preocupações com dinheiro estejam ocupando muito espaço na sua mente."),tip:y("Escribe una sola cosa pequeña que sí puedes hacer hoy.","Write down one small thing you can do today.","Escreva uma única coisa pequena que você pode fazer hoje.")},trabajo:{reason:y("Puede que el trabajo o los estudios te estén pidiendo mucho.","Work or school might be asking a lot of you.","Pode ser que o trabalho ou os estudos estejam exigindo muito de você."),tip:y("Elige una sola tarea para hoy. Una. Las demás pueden esperar.","Pick just one task for today. One. The rest can wait.","Escolha uma única tarefa para hoje. Uma. As outras podem esperar.")},personas:{reason:y("Lo que pasa con las personas que quieres te importa mucho, y eso se siente.","What happens with the people you love matters a lot to you, and you feel it.","O que acontece com as pessoas que você ama importa muito, e isso se sente."),tip:y("Si puedes, habla con alguien de confianza sobre esto.","If you can, talk about it with someone you trust.","Se puder, converse com alguém de confiança sobre isso.")},futuro:{reason:y("Pensar en lo que no sabemos del futuro puede llenar la mente de preguntas.","Thinking about what we don't know about the future can fill the mind with questions.","Pensar no que não sabemos do futuro pode encher a mente de perguntas."),tip:y("Por ahora, piensa solo en hoy. Hoy sí lo puedes vivir.","For now, think only about today. Today you can live.","Por agora, pense só no hoje. O hoje você consegue viver.")},noticias:{reason:y("Lo que ves en noticias y redes puede cargar el corazón sin que lo notes.","What you see in the news and online can weigh on your heart without you noticing.","O que você vê em notícias e redes pode pesar no coração sem você perceber."),tip:y("Prueba una hora sin redes hoy.","Try one hour without social media today.","Experimente uma hora sem redes hoje.")},soledad:{reason:y("Sentir soledad es muy difícil. Tiene sentido que te afecte.","Feeling lonely is really hard. It makes sense that it affects you.","Sentir solidão é muito difícil. Faz sentido que isso te afete."),tip:y("Manda un mensaje corto a alguien que te quiere.","Send a short message to someone who cares about you.","Mande uma mensagem curta para alguém que gosta de você.")},ninguno:{reason:y("A veces no hay una sola razón, y está bien no saberlo todo hoy.","Sometimes there isn't just one reason, and it's okay not to know everything today.","Às vezes não existe um único motivo, e tudo bem não saber tudo hoje."),tip:y("Escucha a tu cuerpo: agua, aire y un descanso cortito.","Listen to your body: water, fresh air and a short break.","Escute seu corpo: água, ar e uma pausa curtinha.")},positivo:{reason:y("¡Qué bueno sentirte así! Fíjate en qué te ayudó, para repetirlo.","So good to feel this way! Notice what helped, so you can do it again.","Que bom se sentir assim! Repare no que ajudou, para repetir."),tip:y("Comparte algo bueno con alguien hoy.","Share something good with someone today.","Compartilhe algo bom com alguém hoje.")}},Xf={default:y("Tiene sentido sentirse así.","It makes sense to feel this way.","Faz sentido se sentir assim."),positive:y("Guarda este momento en tu corazón.","Keep this moment in your heart.","Guarde este momento no coração.")},Zf={respirar:{emoji:"🦋",interactive:"breath",title:y("Respira con la mariposa","Breathe with the butterfly","Respire com a borboleta"),text:y("Cuando las alas se abren, toma aire. Cuando se cierran, suéltalo despacio.","When the wings open, breathe in. When they close, breathe out slowly.","Quando as asas abrirem, puxe o ar. Quando fecharem, solte devagar.")},ventana:{emoji:"🪟",title:y("Ve a la ventana","Go to a window","Vá até a janela"),text:y("Mira el cielo 30 segundos y respira hondo tres veces.","Look at the sky for 30 seconds and take three deep breaths.","Olhe o céu por 30 segundos e respire fundo três vezes.")},agua:{emoji:"💧",title:y("Toma agua","Drink water","Beba água"),text:y("Toma un vaso de agua despacio, sorbo a sorbo.","Drink a glass of water slowly, sip by sip.","Beba um copo de água devagar, gole a gole.")},llamar:{emoji:"📞",title:y("Escribe a alguien","Message someone","Escreva para alguém"),text:y('Manda esto a alguien que te quiere: "Hola, pensé en ti".','Send this to someone who cares: "Hi, I thought of you."','Mande isto para alguém que gosta de você: "Oi, pensei em você".')},voz_alta:{emoji:"🗣️",title:y("Dilo en voz alta","Say it out loud","Diga em voz alta"),text:y("Lee el versículo de abajo en voz alta tres veces.","Read the verse below out loud three times.","Leia o versículo abaixo em voz alta três vezes.")},escribir:{emoji:"✏️",title:y("Escribe una línea","Write one line","Escreva uma linha"),text:y("Escribe en un papel una cosa que te preocupa. Luego dóblalo.","Write one worry on a piece of paper. Then fold it.","Escreva num papel uma coisa que te preocupa. Depois dobre.")},moverse:{emoji:"🙆",title:y("Estírate","Stretch","Alongue-se"),text:y("Sube los brazos al cielo, cuenta hasta 10 y bájalos despacio.","Raise your arms to the sky, count to 10, and lower them slowly.","Levante os braços para o céu, conte até 10 e abaixe devagar.")},gracias:{emoji:"🌻",title:y("Tres gracias","Three thanks","Três obrigados"),text:y("Di tres cosas por las que hoy das gracias.","Say three things you are thankful for today.","Diga três coisas pelas quais você agradece hoje.")}},ep={ansiedad:"respirar",miedo:"respirar",preocupacion:"escribir",confusion:"escribir",tristeza:"ventana",desanimo:"ventana",no_puedo:"respirar",rabia:"moverse",cansancio:"agua",agotamiento:"agua",aburrimiento:"moverse",soledad:"llamar",alegria:"gracias",paz:"voz_alta",gratitud:"gracias",energia:"llamar"},np={es:{active:"RV1909",target:"NVI",license:"Dominio público. NVI requiere permiso de Biblica."},en:{active:"KJV",target:"NIV",license:"Dominio público. NIV requiere permiso de Biblica."},pt:{active:"Almeida",target:"NVI",license:"Dominio público (verificar edición). NVI requiere permiso de Biblica."}},tp=[{id:"rom12_2",ref:y("Romanos 12:2","Romans 12:2","Romanos 12:2"),emotions:["paz","energia","confusion"],text:y("No os conforméis a este siglo; mas reformaos por la renovación de vuestro entendimiento.","Be not conformed to this world: but be ye transformed by the renewing of your mind.","Não vos conformeis com este mundo, mas transformai-vos pela renovação do vosso entendimento."),reflection:y("Dios no quiere que solo repitas cosas. Quiere transformarte por dentro, como la larva que se vuelve mariposa.","God doesn't want you to just repeat things. He wants to change you from the inside, like a caterpillar becoming a butterfly.","Deus não quer que você só repita coisas. Ele quer te transformar por dentro, como a lagarta que vira borboleta.")},{id:"1pe5_7",ref:y("1 Pedro 5:7","1 Peter 5:7","1 Pedro 5:7"),emotions:["preocupacion","ansiedad"],text:y("Echando toda vuestra solicitud en él, porque él tiene cuidado de vosotros.","Casting all your care upon him; for he careth for you.","Lançando sobre ele toda a vossa ansiedade, porque ele tem cuidado de vós."),reflection:y("Jesús no se cansa de tus preocupaciones. Puedes dárselas una por una.","Jesus never gets tired of your worries. You can hand them to him one by one.","Jesus não se cansa das suas preocupações. Você pode entregá-las uma por uma.")},{id:"sal34_18",ref:y("Salmos 34:18","Psalm 34:18","Salmos 34:18"),emotions:["tristeza","no_puedo","soledad"],text:y("Cercano está el Señor a los quebrantados de corazón; y guardará a los contritos de espíritu.","The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","Perto está o Senhor dos que têm o coração quebrantado, e salva os contritos de espírito."),reflection:y("Cuando el corazón duele, Dios no se aleja. Se acerca.","When your heart hurts, God doesn't move away. He comes closer.","Quando o coração dói, Deus não se afasta. Ele se aproxima.")},{id:"mt11_28",ref:y("Mateo 11:28","Matthew 11:28","Mateus 11:28"),emotions:["cansancio","agotamiento","desanimo"],text:y("Venid a mí todos los que estáis trabajados y cargados, que yo os haré descansar.","Come unto me, all ye that labour and are heavy laden, and I will give you rest.","Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei."),reflection:y("Jesús no te pide que llegues fuerte. Te invita a llegar con tu cansancio, tal como estás.","Jesus doesn't ask you to come strong. He invites you to come tired, just as you are.","Jesus não pede que você chegue forte. Ele te convida a chegar com seu cansaço, do jeito que está.")},{id:"jn14_27",ref:y("Juan 14:27","John 14:27","João 14:27"),emotions:["ansiedad","miedo","paz"],text:y("La paz os dejo, mi paz os doy: no como el mundo la da, yo os la doy. No se turbe vuestro corazón, ni tenga miedo.","Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá. Não se turbe o vosso coração, nem se atemorize."),reflection:y("La paz de Jesús no depende de que todo salga bien. Es un regalo que te da hoy.","Jesus' peace doesn't depend on everything going right. It's a gift he gives you today.","A paz de Jesus não depende de tudo dar certo. É um presente que ele te dá hoje.")},{id:"is41_10",ref:y("Isaías 41:10","Isaiah 41:10","Isaías 41:10"),emotions:["miedo","ansiedad","desanimo"],text:y("No temas, que yo soy contigo; no desmayes, que yo soy tu Dios que te esfuerzo: siempre te ayudaré.","Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee.","Não temas, porque eu sou contigo; não te assombres, porque eu sou teu Deus; eu te fortaleço, e te ajudo."),reflection:y("Dios está contigo en esto. Promete ayudarte, no que nunca tendrás miedo.","You are not alone in this. God promises to help you, not that you'll never be afraid.","Deus está com você nisso. Ele promete te ajudar, não que você nunca terá medo.")},{id:"heb13_5",ref:y("Hebreos 13:5","Hebrews 13:5","Hebreus 13:5"),emotions:["soledad"],text:y("No te desampararé, ni te dejaré.","I will never leave thee, nor forsake thee.","Não te deixarei, nem te desampararei."),reflection:y("Aunque te sientas sin compañía, Jesús se quedó contigo. No se va.","Even when you feel alone, Jesus stays with you. He does not leave.","Mesmo quando a solidão aperta, Jesus fica com você. Ele não vai embora.")},{id:"ef4_26",ref:y("Efesios 4:26","Ephesians 4:26","Efésios 4:26"),emotions:["rabia"],text:y("Airaos, y no pequéis; no se ponga el sol sobre vuestro enojo.","Be ye angry, and sin not: let not the sun go down upon your wrath.","Irai-vos e não pequeis; não se ponha o sol sobre a vossa ira."),reflection:y("Sentir rabia no está mal. Lo importante es qué haces con ella antes de dormir.","Feeling angry isn't wrong. What matters is what you do with it before you sleep.","Sentir raiva não é errado. O importante é o que você faz com ela antes de dormir.")},{id:"sal118_24",ref:y("Salmos 118:24","Psalm 118:24","Salmos 118:24"),emotions:["alegria","energia"],text:y("Este es el día que hizo el Señor: nos gozaremos y alegraremos en él.","This is the day which the LORD hath made; we will rejoice and be glad in it.","Este é o dia que fez o Senhor; regozijemo-nos e alegremo-nos nele."),reflection:y("Hoy también es un regalo. Disfrútalo con Dios.","Today is a gift too. Enjoy it with God.","Hoje também é um presente. Aproveite com Deus.")},{id:"sal4_8",ref:y("Salmos 4:8","Psalm 4:8","Salmos 4:8"),emotions:["cansancio","paz"],text:y("En paz me acostaré, y asimismo dormiré; porque solo tú, Señor, me harás estar confiado.","I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.","Em paz também me deitarei e dormirei, porque só tu, Senhor, me fazes habitar em segurança."),reflection:y("Puedes descansar. Dios sigue cuidando mientras duermes.","You can rest. God keeps watching over you while you sleep.","Você pode descansar. Deus continua cuidando enquanto você dorme.")},{id:"mt6_34",ref:y("Mateo 6:34","Matthew 6:34","Mateus 6:34"),emotions:["preocupacion","confusion"],text:y("No os congojéis por el día de mañana; que el día de mañana traerá su fatiga: basta al día su afán.","Take therefore no
