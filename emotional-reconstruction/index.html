거의 늘 그래요","Puede que el cansancio esté influyendo en cómo te sientes. Cuando dormimos poco, todo pesa más.":"피곤함 때문에 이런 기분일 수도 있어요. 잠을 적게 자면 모든 게 더 무겁게 느껴져요.","Esta noche intenta acostarte un poquito más temprano.":"오늘 밤엔 조금 일찍 잠자리에 들어 봐요.","Puede que tu cuerpo necesite energía. Con hambre, las emociones se sienten más fuertes.":"몸에 힘이 필요한 걸 수도 있어요. 배가 고프면 감정이 더 커져요.","Come algo sencillo y toma un vaso de agua.":"간단한 걸 먹고 물 한 잔 마셔요.","Tu cuerpo no está al cien, y eso también cansa el corazón.":"몸이 좋지 않으면 마음도 지쳐요.","Descansa hoy. Si el malestar sigue, habla con un médico.":"오늘은 쉬어요. 계속 몸이 안 좋으면 의사 선생님과 이야기해요.","Los cambios del cuerpo durante el mes pueden mover las emociones. Es normal y pasa.":"한 달 동안 몸이 변하면 감정도 흔들릴 수 있어요. 자연스러운 일이고 곧 지나가요.","Hoy sé amable contigo. Algo calientito y descanso ayudan.":"오늘은 나에게 다정하게 대해 줘요. 따뜻한 것과 휴식이 도움이 돼요.","Puede que las preocupaciones de dinero estén ocupando mucho espacio en tu mente.":"돈 걱정이 마음을 많이 차지하고 있는 것 같아요.","Escribe una sola cosa pequeña que sí puedes hacer hoy.":"오늘 할 수 있는 작은 일 하나를 적어 봐요.","Puede que el trabajo o los estudios te estén pidiendo mucho.":"일이나 공부가 많이 버거운 것 같아요.","Elige una sola tarea para hoy. Una. Las demás pueden esperar.":"오늘은 할 일 하나만 골라요. 딱 하나요. 나머지는 기다려도 돼요.","Lo que pasa con las personas que quieres te importa mucho, y eso se siente.":"사랑하는 사람들의 일이 나에게 정말 중요해서 마음이 쓰여요.","Si puedes, habla con alguien de confianza sobre esto.":"할 수 있다면 믿을 만한 사람과 이야기해 봐요.","Pensar en lo que no sabemos del futuro puede llenar la mente de preguntas.":"모르는 미래를 생각하면 머릿속이 질문으로 가득 찰 수 있어요.","Por ahora, piensa solo en hoy. Hoy sí lo puedes vivir.":"지금은 오늘만 생각해요. 오늘은 살아낼 수 있어요.","Lo que ves en noticias y redes puede cargar el corazón sin que lo notes.":"뉴스나 인터넷에서 본 것이 나도 모르게 마음을 무겁게 할 수 있어요.","Prueba una hora sin redes hoy.":"오늘은 한 시간 동안 SNS를 쉬어 봐요.","Sentir soledad es muy difícil. Tiene sentido que te afecte.":"외로움은 정말 힘들어요. 마음이 흔들리는 게 당연해요.","Manda un mensaje corto a alguien que te quiere.":"나를 아끼는 사람에게 짧은 메시지를 보내 봐요.","A veces as una por una.":"예수님은 내 걱정에 지치지 않으세요. 하나씩 예수님께 맡겨도 돼요.","Salmos 34:18":"시편 34:18","Cuando el corazón duele, Dios no se aleja. Se acerca.":"마음이 아플 때 하나님은 멀어지지 않으세요. 더 가까이 오세요.","Mateo 11:28":"마태복음 11:28","Jesús no te pide que llegues fuerte. Te invita a llegar con tu cansancio, tal como estás.":"예수님은 강한 모습으로 오라고 하지 않으세요. 지친 모습 그대로 오라고 부르세요.","Juan 14:27":"요한복음 14:27","La paz de Jesús no depende de que todo salga bien. Es un regalo que te da hoy.":"예수님의 평안은 모든 일이 잘 풀려야만 오는 게 아니에요. 오늘 주시는 선물이에요.","Isaías 41:10":"이사야 41:10","Dios está contigo en esto. Promete ayudarte, no que nunca tendrás miedo.":"하나님이 이 일에 함께하세요. 두려움이 없을 거라고가 아니라, 도와주시겠다고 약속하셨어요.","Hebreos 13:5":"히브리서 13:5","Aunque te sientas sin compañía, Jesús se quedó contigo. No se va.":"외롭다고 느낄 때도 예수님은 곁에 계세요. 떠나지 않으세요.","Efesios 4:26":"에베소서 4:26","Sentir rabia no está mal. Lo importante es qué haces con ella antes de dormir.":"화가 나는 건 잘못이 아니에요. 중요한 건 잠들기 전에 그 마음을 어떻게 하느냐예요.","Salmos 118:24":"시편 118:24","Hoy también es un regalo. Disfrútalo con Dios.":"오늘도 선물이에요. 하나님과 함께 누려요.","Salmos 4:8":"시편 4:8","Puedes descansar. Dios sigue cuidando mientras duermes.":"편히 쉬어도 돼요. 잠자는 동안에도 하나님이 지켜 주세요.","Mateo 6:34":"마태복음 6:34","Jesús te invita a vivir un día a la vez. Mañana tendrá su propia ayuda.":"예수님은 하루씩 살아가라고 하세요. 내일은 내일의 도움이 있어요.","Lamentaciones 3:22-23":"예레미야애가 3:22-23","Cada mañana Dios empieza de nuevo contigo. Mañana también.":"아침마다 하나님은 나와 새롭게 시작하세요. 내일도요.","Juan 11:35":"요한복음 11:35","Jesús también lloró. Tu tristeza no lo asusta; él la entiende.":"예수님도 우셨어요. 내 슬픔을 예수님은 이해하세요.","Salmos 56:3":"시편 56:3","Tener miedo y confiar pueden pasar al mismo tiempo. Eso también es fe.":"두려우면서도 믿을 수 있어요. 그것도 믿음이에요.","Isaías 40:31":"이사야 40:31","Las fuerzas nuevas vienen de Dios, no de esforzarte más.":"새 힘은 더 애쓰는 데서가 아니라 하나님께로부터 와요.","Juan 10:11":"요한복음 10:11","Jesús es como un pastor que cuida a cada oveja por su nombre. También a ti.":"예수님은 양 한 마리 한 마리의 이름을 아는 목자 같으세요. 나도요.","1 Tesalonicenses 5:18":"데살로니가전서 5:18","Dar gracias a .","Siga as estrelas de um lado para o outro. Com fone, o som também troca de ouvido.")},respirar:{emoji:"🦋",icon:"butterfly",interactive:"breath",title:_("Respira con la mariposa","Breathe with the butterfly","Respire com a borboleta"),text:_("Cuando las alas se abren, toma aire. Cuando se cierran, suéltalo despacio.","When the wings open, breathe in. When they close, breathe out slowly.","Quando as asas abrirem, puxe o ar. Quando fecharem, solte devagar.")},ventana:{icon:"window",emoji:"🪟",title:_("Ve a la ventana","Go to a window","Vá até a janela"),text:_("Mira el cielo 30 segundos y respira hondo tres veces.","Look at the sky for 30 seconds and take three deep breaths.","Olhe o céu por 30 segundos e respire fundo três vezes.")},agua:{icon:"drop",emoji:"💧",title:_("Toma agua","Drink water","Beba água"),text:_("Toma un vaso de agua despacio, sorbo a sorbo.","Drink a glass of water slowly, sip by sip.","Beba um copo de água devagar, gole a gole.")},llamar:{icon:"chat",emoji:"📞",title:_("Escribe a alguien","Message someone","Escreva para alguém"),text:_('Manda esto a alguien que te quiere: "Hola, pensé en ti".','Send this to someone who cares: "Hi, I thought of you."','Mande isto para alguém que gosta de você: "Oi, pensei em você".')},voz_alta:{icon:"speaker",emoji:"🗣️",title:_("Dilo en voz alta","Say it out loud","Diga em voz alta"),text:_("Lee el versículo de abajo en voz alta tres veces.","Read the verse below out loud three times.","Leia o versículo abaixo em voz alta três vezes.")},escribir:{icon:"pencil",emoji:"✏️",title:_("Escribe una línea","Write one line","Escreva uma linha"),text:_("Escribe en un papel una cosa que te preocupa. Luego dóblalo.","Write one worry on a piece of paper. Then fold it.","Escreva num papel uma coisa que te preocupa. Depois dobre.")},moverse:{icon:"stretch",emoji:"🙆",title:_("Estírate","Stretch","Alongue-se"),text:_("Sube los brazos al cielo, cuenta hasta 10 y bájalos despacio.","Raise your arms to the sky, count to 10, and lower them slowly.","Levante os braços para o céu, conte até 10 e abaixe devagar.")},gracias:{icon:"flower",emoji:"🌻",title:_("Tres gracias","Three thanks","Três obrigados"),text:_("Di tres cosas por las que hoy das gracias.","Say three things you are thankful for today.","Diga três coisas pelas quais você agradece hoje.")}},yv={ansiedad:"respirar",miedo:"respirar",preocupacion:"respirar",no_puedo:"respirar",rabia:"bilateral",impulsivo:"bilateral",tristeza:"atencion",desanimo:"atencion",cansancio:"atencion",agotamiento:"atencion",aburrimiento:"atencion",soledad:"atencion",alegria:"gracias",paz:"atencion",gratitud:"gracias",energia:"llamar"},xv={es:{active:"RV1909",target:"NVI",license:"Dominio público. NVI requiere permiso de Biblica."},en:{active:"KJV",target:"NIV",license:"Dominio público. NIV requiere permiso de Biblica."},pt:{active:"Almeida",target:"NVI",license:"Dominio público (verificar edición). NVI requiere permiso de Biblica."},ko:{active:"개역한글",target:"개역한글",license:"Dominio público en Corea (1961). Confirmar estado en EE. UU. con la Sociedad Bíblica de Corea antes del lanzamiento."}},wv=[{id:"rom12_2",ref:_("Romanos 12:2","Romans 12:2","Romanos 12:2"),emotions:["paz","energia","impulsivo"],text:_("No os conforméis a este siglo; mas reformaos por la renovación de vuestro entendimiento.","Be not conformed to this world: but be ye transformed by the renewing of your mind.","Não vos conformeis com este mundo, mas transformai-vos pela renovação do vosso entendimento."),reflection:_("Dios no quiere que solo repitas cosas. Quiere transformarte por dentro, como la larva que se vuelve mariposa.","God doesn't want you to just repeat things. He wants to change you from the inside, like a caterpillar becoming a butterfly.","Deus não quer que você só repita coisas. Ele quer te transformar por dentro, como a lagarta que vira borboleta.")},{id:"1pe5_7",ref:_("1 Pedro 5:7","1 Peter 5:7","1 Pedro 5:7"),emotions:["preocupacion","ansiedad"],text:_("Echando toda vuestra solicitud en él, porque él tiene cuidado de vosotros.","Casting all your care upon him; for he careth for you.","Lançando sobre ele toda a vossa ansiedade, porque ele tem cuidado de vós."),reflection:_("Jesús no se cansa de tus preocupaciones. Puedes dárselas una por una.","Jesus never gets tired of your worries. You can hand them to him one by one.","Jesus não se cansa das suas preocupações. Você pode entregá-las uma por uma.")},{id:"sal34_18",ref:_("Salmos 34:18","Psalm 34:18","Salmos 34:18"),emotions:["tristeza","no_puedo","soledad"],text:_("Cercano está el Señor a los quebrantados de corazón; y guardará a los contritos de espíritu.","The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","Perto está o Senhor dos que têm o coração quebrantado, e salva os contritos de espírito."),reflection:_("Cuando el corazón duele, Dios no se aleja. Se acerca.","When your heart hurts, God doesn't move away. He comes closer.","Quando o coração dói, Deus não se afasta. Ele se aproxima.")},{id:"mt11_28",ref:_("Mateo 11:28","Matthew 11:28","Mateus 11:28"),emotions:["cansancio","agotamiento","desanimo"],text:_("Venid a mí todos los que estáis trabajados y cargados, que yo os haré descansar.","Come unto me, all ye that labour and are heavy laden, and I will give you rest.","Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei."),reflection:_("Jesús no te pide que llegues fuerte. Te invita a llegar con tu cansancio, tal como estás.","Jesus doesn't ask you to come strong. He invites you to come tired, just as you are.","Jesus não pede que você chegue forte. Ele te convida a chegar com seu cansaço, do jeito que está.")},{id:"jn14_27",ref:_("Juan 14:27","John 14:27","João 14:27"),emotions:["ansiedad","miedo","paz"],text:_("La paz os dejo, mi paz os doy: no como el mundo la da, yo os la doy. No se turbe vuestro corazón, ni tenga miedo.","Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá. Não se turbe o vosso coração, nem se atemorize."),reflection:_("La paz de Jesús no depende de que todo salga bien. Es un regalo que te da hoy.","Jesus' peace doesn't depend on everything going right. It's a gift he gives you today.","A paz de Jesus não depende de tudo dar certo. É um presente que ele te dá hoje.")},{id:"is41_10",ref:_("Isaías 41:10","Isaiah 41:10","Isaías 41:10"),emotions:["miedo","ansiedad","desanimo"],text:_("No temas, que yo soy contigo; no desmayes, que yo soy tu Dios que te esfuerzo: siempre te ayudaré.","Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee.","Não temas, porque eu sou contigo; não te assombres, porque eu sou teu Deus; eu te fortaleço, e te ajudo."),reflection:_("Dios está contigo en esto. Promete ayudarte, no que nunca tendrás miedo.","You are not alone in this. God promises to help you, not that you'll never be afraid.","Deus está com você nisso. Ele promete te ajudar, não que você nunca terá medo.")},{id:"heb13_5",ref:_("Hebreos 13:5","Hebrews 13:5","Hebreus 13:5"),emotions:["soledad"],text:_("No te desampararé, ni te dejaré.","I will never leave thee, nor forsake thee.","Não te deixarei, nem te desampararei."),reflection:_("Aunque te sientas sin compañía, Jesús se quedó contigo. No se va.","Even when you feel alone, Jesus stays with you. He does not leave.","Mesmo quando a solidão aperta, Jesus fica com você. Ele não vai embora.")},{id:"ef4_26",ref:_("Efesios 4:26","Ephesians 4:26","Efésios 4:26"),emotions:["rabia"],text:_("Airaos, y no pequéis; no se ponga el sol sobre vuestro enojo.","Be ye angry, and sin not: let not the sun go down upon your wrath.","Irai-vos e não pequeis; não se ponha o sol sobre a vossa ira."),reflection:_("Sentir rabia no está mal. Lo importante es qué haces con ella antes de dormir.","Feeling angry isn't wrong. What matters is what you do with it before you sleep.","Sentir raiva não é errado. O importante é o que você faz com ela antes de dormir.")},{id:"sal118_24",ref:_("Salmos 118:24","Psalm 118:24","Salmos 118:24"),emotions:["alegria","energia"],text:_("Este es el día que hizo el Señor: nos gozaremos y alegraremos en él.","This is the day which the LORD hath made; we will rejoice and be glad in it.","Este é o dia que fez o Senhor; regozijemo-nos e alegremo-nos nele."),reflection:_("Hoy también es un regalo. Disfrútalo con Dios.","Today is a gift too. Enjoy it with God.","Hoje também é um presente. Aproveite com Deus.")},{id:"sal4_8",ref:_("Salmos 4:8","Psalm 4:8","Salmos 4:8"),emotions:["cansancio","paz"],text:_("En paz me acostaré, y asimismo dormiré; porque solo tú, Señor, me harás estar confiado.","I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.","Em paz também me deitarei e dormirei, porque só tu, Senhor, me fazes habitar em segurança."),reflection:_("Puedes descansar. Dios sigue cuidando mientras duermes.","You can rest. God keeps watching over you while you sleep.","Você pode descansar. Deus continua cuidando enquanto você dorme.")},{id:"mt6_34",ref:_("Mateo 6:34","Matthew 6:34","Mateus 6:34"),emotions:["preocupacion","impulsivo"],text:_("No os congojéis por el día de mañana; que el día de mañana traerá su fatiga: basta al día su afán.","Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself.","Não vos inquieteis, pois, pelo dia de amanhã, porque o dia de amanhã cuidará de si mesmo."),reflection:_("Jesús te invita a vivir un día a la vez. Mañana tendrá su propia ayuda.","Jesus invites you to live one day at a time. Tomorrow will have its own help.","Jesus te convida a viver um dia de cada vez. O amanhã terá sua própria ajuda.")},{id:"lam3_22",ref:_("Lamentaciones 3:22-23","Lamentations 3:22-23","Lamentações 3:22-23"),emotions:["desanimo","tristeza","aburrimiento"],text:_("Nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad.","His compassions fail not. They are new every morning: great is thy faithfulness.","As suas misericórdias não têm fim; novas são cada manhã; grande é a tua fidelidade."),reflection:_("Cada mañana Dios empieza de nuevo contigo. Mañana también.","Every morning God starts fresh with you. Tomorrow too.","Cada manhã Deus recomeça com você. Amanhã também.")},{id:"jn11_35",ref:_("Juan 11:35","John 11:35","João 11:35"),emotions:["tristeza","soledad"],text:_("Y lloró Jesús.","Jesus wept.","Jesus chorou."),reflection:_("Jesús también lloró. Tu tristeza no lo asusta; él la entiende.","Jesus cried too. Your sadness doesn't scare him; he understands it.","Jesus também chorou. Sua tristeza não o assusta; ele a entende.")},{id:"sal56_3",ref:_("Salmos 56:3","Psalm 56:3","Salmos 56:3"),emotions:["miedo","ansiedad"],text:_("En el día que temo, yo en ti confío.","What time I am afraid, I will trust in thee.","Em qualquer tempo em que eu temer, confiarei em ti."),reflection:_("Tener miedo y confiar pueden pasar al mismo tiempo. Eso también es fe.","Being afraid and trusting can happen at the same time. That is faith too.","Ter medo e confiar podem acontecer ao mesmo tempo. Isso também é fé.")},{id:"is40_31",ref:_("Isaías 40:31","Isaiah 40:31","Isaías 40:31"),emotions:["agotamiento","cansancio","energia"],text:_("Los que esperan al Señor tendrán nuevas fuerzas; levantarán las alas como águilas.","They that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles.","Os que esperam no Senhor renovarão as forças, subirão com asas como águias."),reflection:_("Las fuerzas nuevas vienen de Dios, no de esforzarte más.","New strength comes from God, not from trying harder.","As forças novas vêm de Deus, não de se esforçar mais.")},{id:"jn10_11",ref:_("Juan 10:11","John 10:11","João 10:11"),emotions:["soledad","miedo","paz","no_puedo"],text:_("Yo soy el buen pastor: el buen pastor su
